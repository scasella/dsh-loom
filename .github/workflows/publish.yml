name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  prepare:
    if: github.repository == 'scasella/dsh-loom'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.plan.outputs.filename }}
      dist-tag: ${{ steps.plan.outputs.distTag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - name: Resolve release identity and npm tag
        id: plan
        run: node scripts/release-plan.mjs
      - name: Require the tagged commit on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loom-package-24
          path: release
      - name: Verify checked archive identity
        env:
          CANDIDATE_FILENAME: ${{ steps.plan.outputs.filename }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          tar -xOf "$CANDIDATE_FILENAME" package/package.json > "$RUNNER_TEMP/packed-package.json"
          cd ..
          node scripts/release-plan.mjs --packed-manifest "$RUNNER_TEMP/packed-package.json"
      - name: Dry run exact checked package
        env:
          CANDIDATE_FILENAME: ${{ steps.plan.outputs.filename }}
          DIST_TAG: ${{ steps.plan.outputs.distTag }}
        run: |
          npm publish "./release/$CANDIDATE_FILENAME" --dry-run --access public \
            --tag "$DIST_TAG" --ignore-scripts --registry=https://registry.npmjs.org/
  publish:
    if: github.event_name == 'push' && github.repository == 'scasella/dsh-loom'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: loom-package-24
          path: release
      - name: Publish verified tarball with npm OIDC
        working-directory: release
        env:
          CANDIDATE_FILENAME: ${{ needs.prepare.outputs.filename }}
          DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish "./$CANDIDATE_FILENAME" --access public --tag "$DIST_TAG" \
            --provenance --ignore-scripts --registry=https://registry.npmjs.org/
