name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    env:
      DEEPSEEK_API_KEY: ''
      OPENROUTER_DEEPSEEK_API_KEY: ''
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install release tooling and dependencies
        run: |
          npm install --global npm@11.21.0 pnpm@10.11.1
          npm ci --no-audit --no-fund
      - name: Build and check types
        run: |
          npm run build
          npm run typecheck
          npm run pack:check
      - name: Pack one candidate
        id: package
        run: |
          mkdir "$RUNNER_TEMP/loom-package"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/loom-package" > "$RUNNER_TEMP/loom-pack.json"
          node --input-type=module <<'NODE'
          import { readFile, writeFile, appendFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          import { join, basename } from 'node:path'
          import assert from 'node:assert/strict'
          const [packed] = JSON.parse(await readFile(join(process.env.RUNNER_TEMP, 'loom-pack.json'), 'utf8'))
          const manifest = JSON.parse(await readFile('package.json', 'utf8'))
          assert.equal(packed.filename, `scasella-dsh-loom-${manifest.version}.tgz`)
          assert.equal(basename(packed.filename), packed.filename)
          const archive = join(process.env.RUNNER_TEMP, 'loom-package', packed.filename)
          const digest = createHash('sha256').update(await readFile(archive)).digest('hex')
          await writeFile(join(process.env.RUNNER_TEMP, 'loom-package/SHA256SUMS'), `${digest}  ${packed.filename}\n`)
          await appendFile(process.env.GITHUB_OUTPUT, `tarball=${archive}\n`)
          NODE
      - name: Install independent official Harness
        run: |
          npm install --prefix "$RUNNER_TEMP/official" --no-audit --no-fund \
            @deepseek-ai/dsh@0.2.1-rc.2 @earendil-works/pi-ai@1.3.0
      - name: Test installed candidate, Web startup, and removal
        env:
          LOOM_CANDIDATE: ${{ steps.package.outputs.tarball }}
        run: |
          npm run verify:stock -- \
            --runtime "$RUNNER_TEMP/official/node_modules/@deepseek-ai/dsh" \
            --tarball "$LOOM_CANDIDATE" --all-tests --web-smoke
      - name: Retain verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loom-package-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/loom-package/*.tgz
            ${{ runner.temp }}/loom-package/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
